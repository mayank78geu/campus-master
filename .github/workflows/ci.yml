name: CI

on:
  push:
    branches: [ main, master, 'fix/**', 'feature/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    name: Backend (Java 17 / Maven)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Make Maven wrapper executable
        run: chmod +x Backend/mvnw

      - name: Run Backend Verify and Tests
        run: |
          cd Backend
          ./mvnw -B verify -Djacoco.skip=false

  frontend:
    name: Frontend (Node 20 / Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'Frontend/package-lock.json'

      - name: Install dependencies
        run: |
          cd Frontend
          npm ci

      - name: Run Unit Tests
        run: |
          cd Frontend
          npm run test

      - name: Build Production Bundle
        run: |
          cd Frontend
          npm run build

      - name: Run Linter
        run: |
          cd Frontend
          npm run lint
