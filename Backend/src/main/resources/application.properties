spring.application.name=campusmaster
server.port=8081

# Docker Compose integration
spring.docker.compose.enabled=false

# Profiles: default to local if none specified
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Common JWT Configuration (Secret must be set via environment variable)
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiration-ms=86400000

# CORS Allowed Origins (supports patterns/wildcards)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://localhost:5173,http://localhost:5174,http://localhost:3000}

# File Upload Limit (PRD: max 25MB)
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Storage Provider: 'local' (default for offline dev) or 'cloudinary'
campusmaster.storage.provider=${CAMPUSMASTER_STORAGE_PROVIDER:local}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Flyway Database Migration
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
